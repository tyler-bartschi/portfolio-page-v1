name: Deploy portfolio

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: portfolio-production-deployment
  cancel-in-progress: false

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
  S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
  CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}

jobs:
  deploy:
    name: Build and deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Validate deployment configuration
        shell: bash
        run: |
          missing=0
          for variable_name in AWS_REGION AWS_ROLE_ARN S3_BUCKET_NAME CLOUDFRONT_DISTRIBUTION_ID; do
            if [[ -z "${!variable_name}" ]]; then
              echo "::error::Set the ${variable_name} repository secret before deploying."
              missing=1
            fi
          done
          exit "${missing}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: portfolio-${{ github.run_id }}

      - name: Upload revalidatable files to S3
        run: >-
          aws s3 sync dist/ "s3://${S3_BUCKET_NAME}/"
          --delete
          --exclude "assets/*"
          --cache-control "public,max-age=0,must-revalidate"
          --only-show-errors
          --no-progress

      - name: Upload versioned assets to S3
        run: >-
          aws s3 sync dist/assets/ "s3://${S3_BUCKET_NAME}/assets/"
          --delete
          --cache-control "public,max-age=31536000,immutable"
          --only-show-errors
          --no-progress

      - name: Invalidate CloudFront cache
        shell: bash
        run: |
          invalidation_id="$(aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)"
          echo "Waiting for CloudFront invalidation ${invalidation_id} to complete."
          aws cloudfront wait invalidation-completed \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --id "${invalidation_id}"
